<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#faf9f6"><title>Modular AI · Chat</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><span class="logo">M</span><div><strong>Modular AI</strong><small>Experimental intelligence · v0.2</small></div></div><button id="new" type="button" class="subtle">New chat</button></header><main><section class="chat"><div class="topline"><span id="status" role="status">Loading core…</span><span id="core"></span></div><div id="messages" role="log" aria-live="polite"></div><div class="examples"><button data-q="Explain lazy loading">Explain lazy loading</button><button data-q="Calculate 12*8 then convert km to miles">Multi-step calculation</button><button data-q="Remember that my favorite color is blue">Teach a fact</button></div><form id="composer"><textarea id="prompt" placeholder="Ask anything within my skills…" aria-label="Message" rows="2"></textarea><button id="send" disabled type="submit">Send ↑</button></form><p class="foot">Runs on this device. No external AI API. Shift+Enter for a new line.</p></section><aside><details><summary>Engine activity</summary><p id="metrics"></p><ol id="trace"></ol><label for="cdn">Optional resource CDN base URL</label><input id="cdn" placeholder="https://cdn.example.com/"><div class="actions"><button id="save">Apply</button><button id="clear">Clear cache</button></div><p>Default: same-origin static CDN. Files are SHA-256 verified before execution.</p></details></aside></main><script type="module" src="app.js"></script></body></html>
