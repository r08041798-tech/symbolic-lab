function doctorPatients(){return head("PATIENT DIRECTORY","My patients","Access assigned patient records and past treatment plans.")+panel("Assigned patients",it("👩","Ananya Sharma","Age 32 · Recorded allergy: Penicillin · Fictional data",button("Clinical notes","nav:scribe",true))+it("👨","Rohit Nair","Age 41 · Medical history not populated",button("Clinical notes","nav:scribe")))+panel("Appointments",appointments())}
function doctorScribe(){return head("CLINICAL DOCUMENTATION","Consultation notes","Draft, review and approve. No AI diagnosis or prescribing occurs here.")+panel("Active patient",it("👩","Ananya Sharma","Age 32 · Penicillin allergy flagged",badge("Demo","amber")))+panel("Visit documentation",'<label class="label" for="notearea">Clinical observations and plan</label>'+textField("Enter clinician-authored history, findings, assessment and plan. Nothing is automatically inferred.","notearea")+'<div class="btnrow">'+button("Save unsigned draft","note-save")+button("Approve demo note","note-approve",true)+'</div><p class="notes">Voice transcription and medical-grade review are not connected. Approval is a simulated workflow, not a legal signature.</p>')+panel("Note status",it("📄","Patient consultation",approvedNote?"Doctor-approved demonstration note":pendingNote?"Unsigned draft exists":"No new draft saved",badge(approvedNote?"Approved":pendingNote?"Draft":"Not started",approvedNote?"":"amber")))}
function doctorMeds(){var matches=medicines.filter(function(m){return (m.name+" "+m.category+" "+m.uses).toLowerCase().indexOf(medQuery.toLowerCase())>=0}),m=medicines.find(function(x){return x.name===selection})||medicines[0];return head("CLINICAL REFERENCE","Medicine library","Search educational generic entries and create unsigned prescription ideas.")+panel("Patient safety context",it("⚠","Ananya Sharma","Recorded allergy: Penicillin · Medication and clinical history incomplete",badge("Review","amber")))+ '<input class="search" id="medsearch" aria-label="Search medicines" placeholder="⌕ Search generic names, categories and clinical uses..." value="'+esc(medQuery)+'"><div class="meds"><section class="panel"><div class="ph"><h2>Medicine catalogue</h2><span class="muted">'+matches.length+' sample entries</span></div>'+matches.map(function(x){return '<button class="medrow '+(x.name===selection?"active":"")+'" data-med="'+esc(x.name)+'"><span class="iicon">💊</span><span class="itxt"><strong>'+esc(x.name)+'</strong><small>'+esc(x.category)+' · '+esc(x.form)+'</small></span>›</button>'}).join("")+'</section><section class="panel detail"><span class="chip grey">Educational demo</span><h2 style="margin-top:12px">'+esc(m.name)+'</h2><span class="chip">'+esc(m.category)+'</span><div class="label">Formulations</div><div class="value">'+esc(m.form)+'</div><div class="label">Common uses</div><div class="value">'+esc(m.uses)+'</div><div class="label">Review points and adverse effects</div><div class="value">'+esc(m.risks)+'</div><div class="label">Indian brand names, doses and interactions</div><div class="value">Not connected to a licensed formulary. No dosing recommendations are generated.</div><div class="caution '+(m.blocked?"danger":"")+'">'+(m.blocked?"Potential allergy conflict in the sample patient. This medicine cannot be added to the demo draft.":"No comprehensive interaction or contraindication check has been performed.")+'</div><button class="btn primary" style="width:100%" data-a="med-add" '+(m.blocked?"disabled":"")+'>+ Add to unsigned draft</button></section></div>'+panel("Unsigned draft",rx.length?rx.map(function(n){return it("💊",n,"Selected for doctor review · No dose or prescription issued",badge("Unsigned","amber"))}).join(""):'<p class="muted">Select medicines above to see draft entries here. No patient-facing prescription is generated.</p>')}
function doctorOrders(){return head("CARE MANAGEMENT","Orders & diagnostics","Tests and treatment schedules require clinician authorisation.")+panel("Clinician-approved sample orders",it("🧪","HbA1c blood test","Ananya Sharma · Diagnostic order",badge("Approved"))+it("🏥","Ultrasound abdomen","Ananya Sharma · Imaging order",badge("Approved"))+it("💙","Home nursing observation","Ananya Sharma · 7 example visits",badge("Approved")))+panel("Booking and result status",bookings.map(function(b){return it("📋",b.type,b.when,badge(b.status))}).join("")||'<p class="muted">Patient service requests will appear here after being submitted.</p>')+panel("Diagnostic results for review",reports.filter(function(r){return !r.approved}).map(function(r,i){return it("🧪",r.title,r.body,button("Review","review:"+i,true))}).join("")||'<p class="muted">No pending results. Lab partners must submit reports before patient release.</p>')}
function nurseHome(){return head("HOME NURSING","Hello, Kavya 👋","Your assigned sample visits, care instructions and handoffs.")+stats([["Assigned visits","07","Example schedule"],["Completed",String(done),"Simulated only"],["Remaining",String(7-done),"Not yet recorded"]])+hero("SAFE HOME CARE","Every visit, connected to a clinical order.","Check approved instructions and keep the care team informed.","My visits →","visits")+panel("Next assignment",it("💉","Ananya Sharma · Observation visit","Day "+Math.min(7,done+1)+" · Example schedule",button("Open visit","nav:visits",true)))+panel("Before any treatment",it("📄","Confirm doctor order","Verify patient identity, order validity and instructions")+it("⚠","Escalate medical concerns","Use qualified clinical protocols and emergency pathways"))}
function nurseVisits(){return head("ASSIGNED VISITS","My home visits","Document only services that were actually performed in a real clinical system.")+panel("Nursing care plan",it("💙","Ananya Sharma","Home nursing observation · Clinician-approved fictional plan",badge("Active"))+'<div class="progress"><div style="width:'+(100*done/7)+'%"></div></div><p class="muted">'+done+' of 7 demo visits marked complete.</p><div class="btnrow">'+button("Simulate next completed visit","nurse-next",true)+'</div><div class="notes">This UI-only simulation cannot verify nurse identity, medication administration, patient response or a valid treatment record.</div>')+panel("Visit history",Array.from({length:7},function(_,i){return it("📅","Visit "+(i+1),"Fictional scheduled care",badge(i<done?"Simulated completed":"Scheduled",i<done?"":"amber"))}).join(""))}
function nurseSchedule(){return head("MY CALENDAR","Nursing schedule","A simple view of appointments and home care assignments.")+panel("This week's sample visits",Array.from({length:7},function(_,i){return it("◷","Day "+(i+1)+" · Home visit","Ananya Sharma · Bengaluru",badge(i<done?"Completed":"Scheduled",i<done?"":"amber"))}).join(""))}
function labHome(){return head("DIAGNOSTIC WORKSPACE","Welcome, lab partner","Sample bookings, collection and clinician-reviewed results.")+stats([["Requests",String(bookings.filter(function(b){return b.type.indexOf("nurs")<0}).length),"In this browser"],["Confirmed",String(bookings.filter(function(b){return b.status==="Confirmed"}).length),"Demo workflow"],["Results",String(reports.length),"Submitted samples"]])+panel("Order queue",bookings.filter(function(b){return b.type!=="Home nursing"}).map(function(b,i){return it("🧪",b.type,b.when,badge(b.status))}).join("")||'<p class="muted">When a patient requests a lab or scan, the sample booking will appear here.</p>')+button("Open booking queue →","nav:requests",true)}
function labRequests(){return head("PARTNER OPERATIONS","Booking requests","Confirm diagnostic booking simulations linked to an approved sample order.")+panel("Pending and scheduled requests",bookings.filter(function(b){return b.type!=="Home nursing"}).map(function(b,i){return it("🧪",b.type,b.when,b.status==="Requested"?button("Confirm","confirm:"+i,true):badge("Confirmed"))}).join("")||'<p class="muted">No diagnostic requests yet. Switch to the patient workspace to create one.</p>')+ '<div class="caution">Demo confirmations are only stored in this browser session. No diagnostics vendor receives a request.</div>'}
function labResults(){return head("RESULT MANAGEMENT","Diagnostic reports","Return results to the treating doctor for review before patient visibility.")+panel("Report workflow",bookings.filter(function(b){return b.type!=="Home nursing"&&b.status==="Confirmed"}).map(function(b){return it("📄",b.type,"Ananya Sharma · Example confirmed request",button("Submit sample result","lab-report:"+b.type,true))}).join("")||'<p class="muted">Confirm a demo lab or imaging booking to unlock sample report submission.</p>')+panel("Submitted results",reports.map(function(r){return it("📋",r.title,r.body,badge(r.approved?"Doctor reviewed":"Pending review",r.approved?"":"amber"))}).join("")||'<p class="muted">No sample results submitted yet.</p>')}
function adminHome(){return head("CARE OPERATIONS","Operations centre","One view across patients, doctors, nursing and diagnostics.")+stats([["Booking requests",String(bookings.length),"Example requests"],["Nursing visits","07","Simulated plan"],["Partner directory","03","Fictional providers"]])+hero("COORDINATED CARE","Connect every step of the care journey.","Manage provider handoffs without losing the patient context.","Open requests →","requests")+panel("Service requests",bookings.map(function(b){return it("📋",b.type,b.when,badge(b.status,b.status==="Requested"?"amber":""))}).join("")||'<p class="muted">No requests yet. Book a service from the patient workspace.</p>')}
function adminRequests(){return head("SERVICE OPERATIONS","Requests & confirmations","A shared queue for fictional partner fulfilment.")+panel("All patient requests",bookings.map(function(b){return it("📋",b.type,b.when,badge(b.status,b.status==="Requested"?"amber":""))}).join("")||'<p class="muted">No bookings submitted.</p>')}
function adminNurses(){return head("HOME CARE OPERATIONS","Nursing coordination","Track visit progress and scheduling against a sample approved order.")+panel("Ananya Sharma · Home nursing",it("💙","Observation visits",done+" of 7 simulated visits completed",badge("Active"))+'<div class="progress"><div style="width:'+(100*done/7)+'%"></div></div>'+button("Open nurse workspace","role:nurse",true))+panel("Safety gates",it("📋","Doctor approval","Required before scheduling treatment")+it("🪪","Credential verification","Not available in this preview",badge("Not connected","amber")))}
function adminProviders(){return head("PARTNER DIRECTORY","Provider network","Illustrative partners only; no real service validation.")+panel("Providers",it("🧪","Asha Diagnostics","Example laboratory · Bengaluru",badge("Unverified","amber"))+it("🏥","City Imaging Studio","Example imaging centre · Bengaluru",badge("Unverified","amber"))+it("💉","Care at Home Network","Example nursing directory · Bengaluru",badge("Unverified","amber")))}
var views={patient:{home:patientHome,care:patientCare,services:patientServices,records:patientRecords,guide:patientGuide},doctor:{home:doctorHome,patients:doctorPatients,scribe:doctorScribe,meds:doctorMeds,orders:doctorOrders},nurse:{home:nurseHome,visits:nurseVisits,schedule:nurseSchedule},lab:{home:labHome,requests:labRequests,results:labResults},admin:{home:adminHome,requests:adminRequests,nurses:adminNurses,providers:adminProviders}};
function render(){
 var ms=menus[role];if(!views[role][page])page="home";
 $("sidenav").innerHTML=ms.map(function(n){return '<button class="nav '+(n[0]===page?"active":"")+'" data-nav="'+n[0]+'"><span class="ni">'+n[1]+'</span>'+n[2]+'</button>'}).join("");
 $("bottomnav").innerHTML=ms.map(function(n){return '<button class="'+(n[0]===page?"active":"")+'" data-nav="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join("");
 $("topname").textContent=ms.find(function(x){return x[0]===page})[2];
 $("content").innerHTML=views[role][page]();
}
document.getElementById("role").addEventListener("change",function(e){role=e.target.value;page="home";render()});
document.addEventListener("input",function(e){if(e.target.id==="medsearch"){var pos=e.target.selectionStart;medQuery=e.target.value;render();var n=$("medsearch");if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener("click",function(e){
 var nav=e.target.closest("[data-nav]");if(nav){navigate(nav.dataset.nav);return}
 var med=e.target.closest("[data-med]");if(med){selection=med.dataset.med;render();return}
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a;
 if(a==="close"){$("overlay").classList.remove("show");return}
 if(a==="save"){
 var v=$("modal-value")?.value?.trim()||"";
 if(action==="note"){if(v.length<5)return msg("Enter a meaningful clinician-authored note.");pendingNote=v;approvedNote=false;msg("Draft saved. Patient cannot see it until approved.")}
 else if(action==="report"){if(v.length<6)return msg("Enter an illustrative sample result.");reports.push({title:action.split(":")[1]||"Sample diagnostic report",body:v,approved:false,comment:""});msg("Sample report submitted for doctor review.")}
 else if(action.indexOf("report:")===0){if(v.length<6)return msg("Enter an illustrative result.");reports.push({title:action.slice(7),body:v,approved:false,comment:""});msg("Sample report sent to doctor review.")}
 else if(action.indexOf("review:")===0){var ind=Number(action.split(":")[1]);var pending=reports.filter(function(r){return !r.approved})[ind];if(pending){pending.approved=true;pending.comment=v||"Reviewed by the sample doctor";msg("Fictional report released to the patient.");}}
 else if(action.indexOf("booking:")===0){bookings.push({type:action.split(":")[1],when:v||"Date to be confirmed",status:"Requested"});msg("Demo request created; no provider was contacted.")}
 $("overlay").classList.remove("show");render();return;
 }
 if(a.indexOf("nav:")===0){navigate(a.slice(4));return}
 if(a.indexOf("role:")===0){role=a.slice(5);$("role").value=role;navigate("home");return}
 if(a.indexOf("day:")===0){done=Math.min(7,Number(a.split(":")[1])+1);render();msg("Simulated visit progress changed. No real care recorded.");return}
 if(a==="nurse-next"){done=Math.min(7,done+1);render();msg("Demo visit progress updated, not actual administration.");return}
 if(a.indexOf("book:")===0){drawer("booking:"+a.slice(5),"Request "+a.slice(5),"Fictional providers only. This is a local UI demonstration; no appointment is made.",'<label class="label">Preferred date or time (optional)</label><input id="modal-value" class="field" type="text" placeholder="e.g. Friday morning">');return}
 if(a==="guide:"){return}
 if(a.indexOf("guide:")===0){drawer("guide","Care navigation","A clinician may consider this specialty, but symptom severity and health context can change the appropriate choice. Severe symptoms require urgent assessment.",'<div class="caution">Selected concern: '+esc(a.slice(6))+'. Not a diagnosis or validated triage result.</div>');return}
 if(a==="note-save"){var val=$("notearea").value.trim();if(!val)return msg("Enter clinical notes first.");pendingNote=val;approvedNote=false;render();msg("Unsigned note saved. Only doctor view can show it.");return}
 if(a==="note-approve"){var value=$("notearea")?.value?.trim()||pendingNote;if(!value)return msg("Add notes and review before approving.");pendingNote=value;approvedNote=true;render();msg("Fictional note approved; check the patient records.");return}
 if(a==="med-add"){if(selection==="Amoxicillin")return msg("Potential allergy conflict. Entry blocked in demo.");if(rx.indexOf(selection)<0)rx.push(selection);render();msg("Medicine added to unsigned draft. No prescription issued.");return}
 if(a.indexOf("confirm:")===0){var idx=Number(a.slice(8));var diagnostics=bookings.filter(function(b){return b.type!=="Home nursing"});if(diagnostics[idx])diagnostics[idx].status="Confirmed";render();msg("Sample booking confirmed in demo only.");return}
 if(a.indexOf("lab-report:")===0){drawer("report:"+a.slice(11),"Submit sample lab result","Fictional text only. Doctor review is mandatory before patient release.",textField("Enter a fictional diagnostic summary. Never use real patient data.","modal-value"));return}
 if(a.indexOf("review:")===0){drawer(a,"Doctor review of report","This is an illustrative approval, not a clinically valid report release.",textField("Doctor-approved fictional explanation","modal-value"));return}
});
render();
})();
</script>
</body>
</html>
