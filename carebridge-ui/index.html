<main class="main"><header class="top"><div><div class="topname" id="topname">My health</div><div class="topsub">CareBridge · Mobile-first healthcare preview</div></div><div class="topright"><span class="demo" style="white-space:nowrap">DEMO</span><select id="role" class="role" aria-label="Switch workspace"><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="nurse">Nurse</option><option value="lab">Lab & imaging</option><option value="admin">Coordinator</option></select><div class="avatar">CB</div></div></header><div id="content" class="content"></div></main>

<div id="toast" class="toast" role="status"></div>
<script>
(function(){
"use strict";
var role="patient",page="home",selection="Metformin",medQuery="",action="",done=2,approvedNote=false;
var bookings=[],reports=[],pendingNote="",rx=[],labStatus=false,noticeTimer;
var patient="Ananya Sharma", appointment="18 Nov 2026 · 10:30 AM";

var doctorClinics=[
 {id:"c1",name:"Oakline Family Clinic",location:"Indiranagar, Bengaluru",start:"09:00",end:"13:00",buffer:60,active:true},
 {id:"c2",name:"Northside Medical Centre",location:"Whitefield, Bengaluru",start:"16:00",end:"20:00",buffer:60,active:true}
];
var doctorVisits=[
 {id:1,patient:"Ananya Sharma",reason:"Follow-up consultation",time:"09:30",clinicId:"c1"},
 {id:2,patient:"Rohit Nair",reason:"New consultation",time:"11:45",clinicId:"c1"},
 {id:3,patient:"Priya Kapoor",reason:"Report review",time:"16:30",clinicId:"c2"}
];
var alertSerial=2;
var careAlerts=[
 {id:1,target:"doctor",title:"Clinic handoff reminder",detail:"Two sample clinic sessions are planned today. Review your travel buffer.",kind:"info",page:"clinics",read:false}
];
function addAlert(target,title,detail,kind,destination,read){
 careAlerts.unshift({id:alertSerial++,target:target,title:title,detail:detail,kind:kind||"info",page:destination||"home",read:!!read});
 if(careAlerts.length>60)careAlerts.length=60;
}
function unreadFor(target){return careAlerts.filter(function(a){return a.target===target&&!a.read}).length}
function infoFeed(target,limit){
 var all=careAlerts.filter(function(a){return a.target===target});
 if(limit)all=all.slice(0,limit);
 return all.length?all.map(function(a){
  return '<div class="notification-row '+(!a.read?"unread":"")+'"><span class="notification-icon">'+(a.kind==="action"?"🧪":a.kind==="warning"?"⚠️":"🔔")+'</span><div class="details"><strong>'+esc(a.title)+(!a.read?'<i class="indicator"></i>':"")+'</strong><p>'+esc(a.detail)+'</p><span class="chip '+(a.kind==="action"?"amber":"")+'">'+(a.kind==="action"?"Needs review":"For awareness")+'</span></div>'+button(a.read?"Open":"View","alert:"+a.id)+'</div>';
 }).join(""):'<p class="muted">No updates yet. New lab results, nursing events and appointment changes will appear here in this demo.</p>';
}
function clockMinutes(v){var p=String(v||"").split(":").map(Number);return p.length===2&&p.every(Number.isFinite)?p[0]*60+p[1]:NaN}
function fmtGap(mins){return mins>=60?Math.floor(mins/60)+"h "+(mins%60?mins%60+"m":""):mins+"m"}
function sortedClinics(){return doctorClinics.filter(function(c){return c.active}).sort(function(a,b){return clockMinutes(a.start)-clockMinutes(b.start)})}
function transitionHtml(){
 var c=sortedClinics();if(c.length<2)return '<p class="muted">Add another active clinic to see session transitions and transfer allowances.</p>';
 return c.slice(1).map(function(next,i){var prev=c[i],gap=clockMinutes(next.start)-clockMinutes(prev.end),buffer=next.buffer||0,conflict=gap<buffer;
 return '<div class="transition '+(conflict?"warn":"")+'"><strong>'+(conflict?"⚠ Schedule needs adjustment":"✓ Transfer window")+'</strong><div>'+esc(prev.name)+' ends at '+esc(prev.end)+' → '+esc(next.name)+' starts at '+esc(next.start)+'.</div><div>Gap: <b>'+fmtGap(Math.max(0,gap))+'</b> · Configured travel buffer: <b>'+buffer+' min</b>'+(gap<0?' · Sessions overlap':'')+'</div></div>';
 }).join("")+'<p class="footer-note">Travel allowance is manually configured, not a map-based journey-time estimate. Actual traffic and travel must be checked separately.</p>';
}
function clinicFields(c){
 c=c||{name:"",location:"",start:"09:00",end:"13:00",buffer:60};
 return '<label class="label">Clinic / hospital name</label><input id="modal-clinic-name" class="field" maxlength="70" value="'+esc(c.name)+'" placeholder="Clinic name" required>'+
 '<label class="label">Address or neighbourhood</label><input id="modal-clinic-location" class="field" maxlength="100" value="'+esc(c.location)+'" placeholder="Bengaluru area" required>'+
 '<div class="cards"><div><label class="label">Starts at</label><input id="modal-clinic-start" class="field" type="time" value="'+esc(c.start)+'"></div><div><label class="label">Ends at</label><input id="modal-clinic-end" class="field" type="time" value="'+esc(c.end)+'"></div></div>'+
 '<label class="label">Travel / transition allowance (minutes)</label><input id="modal-clinic-buffer" class="field" type="number" min="0" max="240" value="'+esc(c.buffer)+'">'+
 '<p class="footer-note">Optional workspace schedule. This does not book real clinic sessions.</p>';
}
function visitFields(){
 var active=sortedClinics();
 return '<label class="label">Clinic</label><select id="modal-visit-clinic" class="field">'+active.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+' · '+esc(c.start)+'–'+esc(c.end)+'</option>'}).join("")+'</select>'+
 '<label class="label">Patient name (fictional)</label><input id="modal-visit-patient" maxlength="70" class="field" placeholder="Sample patient" value="Ananya Sharma">'+
 '<div class="cards"><div><label class="label">Time</label><input id="modal-visit-time" type="time" class="field" value="'+(active[0]?esc(active[0].start):"09:00")+'"></div><div><label class="label">Reason</label><input id="modal-visit-reason" class="field" maxlength="70" value="Consultation"></div></div>'+
 '<p class="footer-note">The demo checks clinic hours and 20-minute appointment spacing, but cannot check an external hospital calendar.</p>';
}
function doctorClinicsPage(){
 var clinics=doctorClinics,visits=doctorVisits.slice().sort(function(a,b){return clockMinutes(a.time)-clockMinutes(b.time)});
 return head("OPTIONAL MULTI-LOCATION PRACTICE","My clinics & schedule","One doctor's calendar across hospitals, clinics and travel transitions.")+
 '<div class="doctor-hero"><div><div class="eyebrow">YOUR WORKDAY · DEMO</div><h1>Every clinic. One calendar.</h1><p>Plan sessions and appointments around your travel time.</p></div>'+button("+ Add clinic","clinic-add",true)+'</div>'+
 panel("My workplaces",'<div class="clinic-grid">'+clinics.map(function(c){return '<div class="clinic-card"><div class="clinic-top"><span class="clinic-badge">'+(c.active?"Active":"Paused")+'</span><span class="muted">'+esc(c.id)+'</span></div><h3>'+esc(c.name)+'</h3><p>📍 '+esc(c.location)+'</p><div class="clinic-time">'+esc(c.start)+' – '+esc(c.end)+'</div><div class="clinic-meta">Travel allowance before session: '+Number(c.buffer)+' min</div><div class="clinic-actions">'+button("Edit","clinic-edit:"+c.id)+button(c.active?"Pause":"Enable","clinic-toggle:"+c.id)+'</div></div>'}).join("")+'</div><p class="notes">Adding multiple locations is optional; solo-practice doctors can keep one clinic.</p>')+
 panel("Today's combined appointments",'<div class="btnrow" style="margin:0 0 10px">'+button("+ Add appointment","visit-add",true)+'</div>'+visits.map(function(v){var c=doctorClinics.find(function(t){return t.id===v.clinicId});return '<div class="schedule-row"><div class="schedule-clock">'+esc(v.time)+'</div><div class="schedule-detail"><strong>'+esc(v.patient)+' · '+esc(v.reason)+'</strong><small>'+esc(c?c.name:"Unassigned")+' · '+esc(c?c.location:"")+'</small></div></div>'}).join(""))+
 panel("Clinic transitions",transitionHtml());
}
function doctorInboxPage(){return head("DOCTOR ACTIVITY","Patient updates & reports","Action-required alerts are shown before routine updates; no real notifications are sent.")+
 '<div class="btnrow" style="margin-bottom:15px">'+button("Mark all read","alerts-read")+' '+button("Review reports","nav:orders",true)+'</div>'+
 panel("All updates · "+unreadFor("doctor")+" unread",infoFeed("doctor"))+
 '<div class="caution">When a lab uploads a result, the doctor receives a review alert first. Patients see it only after the doctor approves its release. Critical-result handling requires a separate validated escalation protocol before clinical use.</div>';
}

var menus={patient:[["home","⌂","Home"],["care","♡","Care plan"],["services","⌕","Services"],["records","▤","Records"],["guide","✦","Care guide"]],
doctor:[["home","⌂","Overview"],["patients","♙","Patients"],["clinics","▦","My clinics"],["inbox","◉","Updates"],["scribe","✎","Clinical notes"],["meds","◈","Medicines"],["orders","▤","Care orders"]],
nurse:[["home","⌂","Overview"],["visits","◷","Visits"],["schedule","▦","Schedule"]],
lab:[["home","⌂","Overview"],["requests","▦","Bookings"],["results","▣","Reports"]],
admin:[["home","⌂","Overview"],["requests","▦","Requests"],["nurses","♡","Nursing"],["providers","♧","Providers"]]};
var medicines=[
{name:"Metformin",category:"Diabetes",form:"Oral immediate or extended-release tablet",uses:"Type 2 diabetes management when clinically indicated",risks:"Gastrointestinal effects; review kidney function, dehydration and other medical conditions."},
{name:"Paracetamol",category:"Pain & fever",form:"Oral tablets and liquid",uses:"Pain and fever relief",risks:"Excessive exposure can cause serious liver injury. Review combination products and liver disease."},
{name:"Amlodipine",category:"Cardiovascular",form:"Oral tablet",uses:"Hypertension and certain forms of angina",risks:"Swelling, flushing and dizziness. Review blood pressure and other medication."},
{name:"Amoxicillin",category:"Antibiotics",form:"Oral tablets/capsules and suspensions",uses:"Susceptible bacterial infections where indicated",risks:"IMPORTANT: Sample patient has a recorded penicillin allergy. Review the allergy before any prescribing decision.",blocked:true},
{name:"Cetirizine",category:"Allergy",form:"Oral tablet or liquid",uses:"Selected allergic symptoms",risks:"Sedation, fatigue and renal-function considerations."},
{name:"Salbutamol",category:"Respiratory",form:"Inhaled and other formulations",uses:"Bronchospasm relief when clinically appropriate",risks:"Tremor, palpitations; review overall asthma/respiratory treatment plan."},
{name:"Omeprazole",category:"Gastrointestinal",form:"Oral delayed-release formulation",uses:"Acid-related gastrointestinal conditions",risks:"Review ongoing indication, long-term duration and interactions."},
{name:"Levothyroxine",category:"Endocrine",form:"Oral tablet",uses:"Thyroid hormone replacement",risks:"Therapy is individualised based on clinical status and thyroid investigations."}
];
function $(id){return document.getElementById(id)}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function badge(text,tone){return '<span class="chip '+(tone||"")+'">'+esc(text)+'</span>'}
function button(text,a,primary){return '<button class="btn '+(primary?"primary":"")+'" data-a="'+esc(a)+'">'+esc(text)+'</button>'}
function it(ic,title,subtitle,right){return '<div class="item"><span class="iicon">'+ic+'</span><div class="itxt"><strong>'+esc(title)+'</strong><small>'+esc(subtitle)+'</small></div>'+(right||"")+'</div>'}
function panel(title,body,link){return '<section class="panel"><div class="ph"><h2>'+esc(title)+'</h2>'+(link||"")+'</div>'+body+'</section>'}
function head(k,t,sub){return '<div class="head"><div class="eyebrow">'+esc(k)+'</div><h1>'+esc(t)+'</h1><p>'+esc(sub)+'</p></div>'}
function hero(k,t,sub,label,dest){return '<div class="hero"><div><div class="k">'+esc(k)+'</div><strong>'+esc(t)+'</strong><p>'+esc(sub)+'</p></div><button data-nav="'+dest+'">'+esc(label)+'</button></div>'}
function stats(rows){return '<div class="stats">'+rows.map(function(r){return '<div class="stat"><small>'+esc(r[0])+'</small><b>'+esc(r[1])+'</b><em>'+esc(r[2])+'</em></div>'}).join("")+'</div>'}
function quick(rows){return '<div class="quick">'+rows.map(function(r){return '<button data-a="'+esc(r[2])+'"><span>'+r[0]+'</span>'+esc(r[1])+'</button>'}).join("")+'</div>'}
function msg(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(noticeTimer);noticeTimer=setTimeout(function(){$("toast").style.display="none"},3200)}
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:"instant"})}
function drawer(a,title,description,fields){action=a;$("modtitle").textContent=title;$("moddesc").textContent=description;$("modfields").innerHTML=fields||"";$("overlay").classList.add("show")}
function textField(placeholder,id){return '<textarea id="'+id+'" class="field" placeholder="'+esc(placeholder)+'"></textarea>'}
function appointments(){return it("📅","Follow-up consultation",appointment+" · Dr. Meera Rao",badge("Confirmed"))}
function patientHome(){
return '<div class="patient-welcome-content"><section class="welcome-screen"><h1 class="welcome-heading">Good evening, Ananya</h1><div class="smile">☺ <span>›</span></div><p class="welcome-sub">What can we help you take care of today?</p><div class="welcome-grid">'+
[
 ["▦","Schedule","New appointment","book:Doctor consultation"],
 ["☏","Care guide","Find the right help","nav:guide"],
 ["✚","View records","Your health reports","nav:records"],
 ["♡","My tasks","Care plan & reminders","nav:care"]
].map(function(x){return '<button class="welcome-tile" data-a="'+x[3]+'"><span class="glyph">'+x[0]+'</span><span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></span></button>'}).join("")+
'</div></section><section class="warm-section"><div class="warm-header"><h2>Appointments</h2><button data-a="nav:services">See all ›</button></div><div class="upcoming-card"><div class="upcoming-icon">♧</div><div class="upcoming-body"><strong>Follow-up consultation</strong><small>'+esc(appointment)+'</small><small>Dr. Meera Rao</small></div><div class="upcoming-right">'+badge("Upcoming")+'<b>›</b></div></div></section></div>'+
'<h2 class="care-heading">Your care, all in one place</h2>'+stats([["Pending tests","02","Doctor-approved orders"],["Nursing progress",done+"/7","Demo visit tracker"],["Health updates",unreadFor("patient"),"For your review"]])+
'<div class="two"><div>'+panel("Next steps",it("🧪","HbA1c blood test","Approved order · Home collection may be available",button("Request","book:Lab test",true))+it("🏥","Ultrasound abdomen","Approved order · Find a scan centre",button("Request","book:Imaging scan"))+it("💉","Home nursing",done+" of 7 simulated visits recorded",badge("In progress")))+panel("My health updates",infoFeed("patient",3))+'</div><div>'+panel("Your care companion",quick([["💊","Prescription guide","nav:records"],["📅","Visit schedule","nav:care"],["🧪","Labs & scans","nav:services"],["🩺","Choose specialist","nav:guide"]]))+'</div></div>';
}
function patientCare(){return head("MY TREATMENT JOURNEY","Your care plan","Follow the next steps from consultation through recovery.")+panel("Your shared timeline",it("✅","Doctor consultation","11 Nov 2026 · Fictional completed visit",badge("Completed"))+it("🧪","Lab & imaging tests","HbA1c blood test · Ultrasound abdomen",badge("Approved"))+it("💉","Home nursing visits","Authorised sample monitoring plan",badge("In progress"))+it("📅","Follow-up appointment",appointment,badge("Scheduled")))+panel("Home nursing schedule · Example",'<div style="display:flex;justify-content:space-between"><strong>'+done+' of 7 demo visits</strong><span class="muted">No clinical administration is recorded</span></div><div class="progress"><div style="width:'+(100*done/7)+'%"></div></div><div class="days">'+Array.from({length:7},function(_,i){return '<button class="day '+(i<done?"done":i===done?"next":"")+'" data-a="day:'+i+'">'+(i<done?"✓":i+1)+'</button>'}).join("")+'</div><div class="notes">Tap a day to simulate status. Actual injections require clinician orders, qualified staff and a verified administration record.</div>')+panel("Doctor-approved orders",it("🧪","HbA1c blood test","Order present in fictional care plan",badge("Approved"))+it("🏥","Ultrasound abdomen","Order present in fictional care plan",badge("Approved"))+it("💙","Home nursing monitoring","Example visit plan · Not an injection prescription",badge("Approved")))}
function patientServices(){return head("DISCOVER CARE","Services & providers","Explore sample care options matched to doctor-approved orders.")+quick([["🩺","Care navigation","nav:guide"],["🧪","Request blood test","book:Lab test"],["🏥","Request scan","book:Imaging scan"],["💉","Request home nurse","book:Home nursing"]])+ '<div style="height:15px"></div>'+panel("Sample provider directory",it("🧪","Asha Diagnostics","Indiranagar, Bengaluru · Example ₹450 HbA1c",button("Request","book:Lab test",true))+it("🏥","City Imaging Studio","Jayanagar, Bengaluru · Scan pricing not connected",button("Request","book:Imaging scan"))+it("💉","Care at Home Network","Bengaluru · Sample nursing directory",button("Request","book:Home nursing")))+panel("My service requests",bookings.length?bookings.map(function(b){return it("📋",b.type,b.when,badge(b.status,b.status==="Requested"?"amber":""))}).join(""):'<p class="muted">No booking requests yet. These are demonstration-only; no partners are contacted.</p>')+'<div class="caution">All providers are fictional and unverified. Sample prices are illustrative, not real quotes.</div>'}
function patientRecords(){return head("YOUR MEDICAL HISTORY","Health records","Doctor-approved documents, reports and medication information.")+panel("Clinical records",it("📄","Consultation summary","11 Nov 2026 · Dr. Meera Rao",badge("Approved"))+(approvedNote?it("📄","New approved clinical note",pendingNote,badge("Approved")):"")+it("💊","Prescription directions","No signed prescription created in this preview",badge("Not issued","grey")))+panel("Diagnostic reports",reports.filter(function(r){return r.approved}).map(function(r){return it("🧪",r.title,r.comment,badge("Reviewed"))}).join("")||'<p class="muted">Doctor-reviewed reports will appear here after partner submission and clinician release.</p>')+panel("Record access","<p class='muted'>Production family sharing and health-record exchange require verified patient consent and access controls. Do not upload real health information here.</p>")}
function patientGuide(){return head("CARE NAVIGATION","Find the appropriate care","Educational guidance to help choose where to start. It is not a diagnostic or emergency triage tool.")+panel("What type of help do you need?",'<div class="cards">'+[["👂","Ear or hearing concerns","A clinician may consider ENT evaluation depending on symptoms."],["🦴","Joint or injury concerns","A clinician may consider orthopaedic or musculoskeletal assessment."],["💓","Heart-related symptoms","Severe chest pain or breathing difficulty warrants emergency assessment."],["🩺","Unclear or multiple symptoms","A GP / family physician is often the best first contact."]].map(function(x){return '<div class="card"><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p>'+button("View guidance","guide:"+x[1])+'</div>'}).join("")+'</div>')+'<div class="caution danger">For severe chest pain, difficulty breathing, signs of stroke, heavy bleeding or other emergencies, seek emergency medical care immediately. Do not rely on this demo for urgent decisions.</div>'}
function doctorHome(){
var due=reports.filter(function(r){return !r.approved}).length;var visits=doctorVisits.slice().sort(function(a,b){return clockMinutes(a.time)-clockMinutes(b.time)});
return '<div class="doctor-hero"><div><div class="eyebrow">DOCTOR WORKSPACE</div><h1>Good evening, Doctor</h1><p>Your clinics, appointments and patient updates in one view.</p></div>'+button("View my clinics →","nav:clinics",true)+'</div>'+
stats([["Today's appointments",doctorVisits.length,"Across "+sortedClinics().length+" active clinics"],["Results to review",due,"Need doctor approval"],["Unread updates",unreadFor("doctor"),"Clinic & patient activity"]])+
'<div class="two"><div>'+
panel("Today's clinic sessions",'<div class="clinic-grid">'+sortedClinics().map(function(c){return '<div class="clinic-card"><span class="clinic-badge">'+esc(c.start)+'–'+esc(c.end)+'</span><h3>'+esc(c.name)+'</h3><p>📍 '+esc(c.location)+'</p></div>'}).join("")+'</div><div class="btnrow">'+button("Manage clinics & travel","nav:clinics")+'</div>')+
panel("Consolidated appointment queue",visits.map(function(v){var c=doctorClinics.find(function(t){return t.id===v.clinicId});return it("👤",v.patient,v.time+" · "+(c?c.name:"Unassigned"),badge(v.reason))}).join("")+ '<div class="btnrow">'+button("+ Appointment","visit-add")+'</div>')+
'</div><div>'+
panel("Patient updates",infoFeed("doctor",3)+'<div class="btnrow">'+button("View all updates →","nav:inbox",true)+'</div>')+
panel("Quick actions",quick([["📝","Clinical notes","nav:scribe"],["💊","Medicine library","nav:meds"],["🧪","Review results","nav:orders"],["🏥","Clinic schedule","nav:clinics"]]))+
'</div></div>'+panel("Between-clinic travel",transitionHtml());
}
function doctorPatients(){return head("PATIENT DIRECTORY","My patients","Access assigned patient records and past treatment plans.")+panel("Assigned patients",it("👩","Ananya Sharma","Age 32 · Recorded allergy: Penicillin · Fictional data",button("Clinical notes","nav:scribe",true))+it("👨","Rohit Nair","Age 41 · Medical history not populated",button("Clinical notes","nav:scribe")))+panel("Appointments",appointments())}
function doctorScribe(){return head("CLINICAL DOCUMENTATION","Consultation notes","Draft, review and approve. No AI diagnosis or prescribing occurs here.")+panel("Active patient",it("👩","Ananya Sharma","Age 32 · Penicillin allergy flagged",badge("Demo","amber")))+panel("Visit documentation",'<label class="label" for="notearea">Clinical observations and plan</label>'+textField("Enter clinician-authored history, findings, assessment and plan. Nothing is automatically inferred.","notearea")+'<div class="btnrow">'+button("Save unsigned draft","note-save")+button("Approve demo note","note-approve",true)+'</div><p class="notes">Voice transcription and medical-grade review are not connected. Approval is a simulated workflow, not a legal signature.</p>')+panel("Note status",it("📄","Patient consultation",approvedNote?"Doctor-approved demonstration note":pendingNote?"Unsigned draft exists":"No new draft saved",badge(approvedNote?"Approved":pendingNote?"Draft":"Not started",approvedNote?"":"amber")))}

function taskCards(list){
 if(!list.length)return '<div class="no-task">Nothing requiring action in this category.</div>';
 return list.map(function(t){
  var report=findReportForTask(t),open=report&&!report.approved;
  var actions=t.acked?badge("✓ Acknowledged"):button("Acknowledge","task-ack:"+t.id);
  actions+=button("Assign","task-assign:"+t.id);
  if(t.type==="report"&&open)actions+=button("Review report","task-review:"+t.id,true);
  else if(t.type==="report"&&report&&report.approved&&t.priority!=="critical")actions+=badge("Doctor reviewed");
  else actions+=button(t.priority==="critical"?"Document escalation":"Resolve","task-resolve:"+t.id,t.priority==="critical");
  return '<div class="task-row '+t.priority+'"><span class="task-symbol">'+({critical:"🚨",review:"🧪",followup:"📅",routine:"🔔"})[t.priority]+'</span><div class="task-body"><strong>'+esc(t.title)+'</strong><p>'+esc(t.patient)+' · '+esc(t.detail)+'</p><div class="task-meta"><span class="tier '+t.priority+'">'+tierName(t.priority)+'</span><span class="tier">'+esc(t.status)+'</span><span class="tier">Owner: '+esc(t.owner)+'</span></div><div class="task-actions">'+actions+'</div></div></div>';
 }).join("");

function taskCentre(limit){

 matching=matching.slice().sort(function(a,b){return rank[a.priority]-rank[b.priority]});

 var tabs=[["all","All "+all.length],["critical","Urgent "+tasksOf("critical").length],["review","Reports "+tasksOf("review").length],["followup","Follow-ups "+tasksOf("followup").length],["routine","Routine "+tasksOf("routine").length]];

function timeInIST(){
 try{var parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
 var hour=Number(parts.find(function(p){return p.type==="hour"}).value),min=Number(parts.find(function(p){return p.type==="minute"}).value);
 return hour*60+min;}catch(e){return new Date().getHours()*60+new Date().getMinutes();}
}

 var nextVisit=visits.find(function(v){return clockMinutes(v.time)>=m})||visits[0];
 var isNextDay=nextVisit&&clockMinutes(nextVisit.time)<m;
 var c=nextVisit?doctorClinics.find(function(x){return x.id===nextVisit.clinicId}):null;
 return {current:current,next:next,visit:nextVisit,visitClinic:c,nextDay:isNextDay};
}

 else if(action.indexOf("report:")===0){if(v.length<6)return msg("Enter an illustrative result.");var reportTitle=action.slice(7),rep={id:"rpt-"+(taskSerial++),title:reportTitle,body:v,approved:false,comment:"",flag:"unassessed"};reports.push(rep);createReportTask(rep,false);addAlert("doctor","Diagnostic report awaiting clinician review","Ananya Sharma · "+reportTitle+" · No AI-based normality classification is connected.","action","inbox");msg("Demo report sent to doctor review. An update appears in the doctor workspace.")}
 else if(action.indexOf("review:")===0){var ind=Number(action.split(":")[1]);var pending=reports.filter(function(r){return !r.approved})[ind];if(pending){pending.approved=true;pending.comment=v||"Reviewed by the sample doctor";var reportTask=doctorTasks.find(function(t){return t.reportId===pending.id});if(reportTask&&reportTask.priority!=="critical"){reportTask.status="resolved";reportTask.acked=true;reportTask.resolution="Doctor-approved report release (demo).";}addAlert("patient","Report reviewed by your doctor",pending.title+" · Dr. Meera Rao approved release of the fictional result.","info","records");addAlert("doctor","Report release logged",pending.title+" was reviewed and released to the sample patient.","info","orders",true);msg("Demo result released to patient after doctor review.");}}
 else if(action.indexOf("booking:")===0){bookings.push({type:action.split(":")[1],when:v||"Date to be confirmed",status:"Requested"});msg("Demo request created; no provider was contacted.")}

 if(a==="clinic-add"){drawer("clinic-add","Add clinic or hospital","Add another optional place of practice. This is a fictional schedule.",clinicFields());return}
 if(a.indexOf("clinic-edit:")===0){var c=doctorClinics.find(function(x){return x.id===a.split(":")[1]});if(c)drawer(a,"Edit clinic schedule","Update your working hours and manual travel allowance.",clinicFields(c));return}

 if(a==="alerts-read"){careAlerts.filter(function(x){return x.target==="doctor"}).forEach(function(x){x.read=true});render();msg("Doctor updates marked read in this browser.");return}
 if(a.indexOf("alert:")===0){var notification=careAlerts.find(function(x){return x.id===Number(a.split(":")[1])});if(notification){notification.read=true;navigate(notification.page||"home")}return}

 
 if(a.indexOf("task-filter:")===0){taskFilter=a.slice(12);render();return}
 if(a.indexOf("task-ack:")===0){
  var task=taskForId(a.slice(9));

  '<label class="label">Assigned professional</label><select id="modal-task-owner" class="field">'+

  '</select><p class="notes">In production, assigning clinical responsibility requires permission checks and confirmation of acceptance.</p>');return;
 }
 if(a.indexOf("task-resolve:")===0){
  var task=taskForId(a.slice(13));
  if(!task)return msg("Task not found.");
  if(task.type==="report"&&findReportForTask(task)&&!findReportForTask(task).approved)return msg("Doctor must review the result before it can be closed.");
  drawer(a,task.priority==="critical"?"Document sample critical-result escalation":"Document task resolution",
  task.priority==="critical"?"Simulated only. A real critical result needs laboratory-verified details, prompt direct clinician contact and a time-stamped communication record. Clicking save is NOT an actual escalation.":"Describe the action taken. This demonstration does not contact patients or providers.",
  '<label class="label">Action / handoff details</label>'+textField("Enter a fictional note explaining follow-up or escalation.","modal-value"));return;
 }
 if(a.indexOf("task-review:")===0){
  var task=taskForId(a.slice(12)),report=task?findReportForTask(task):null;
  if(!report)return msg("Associated report missing.");
  if(report.approved)return msg("Already reviewed; close any remaining follow-up separately.");
  var index=reports.filter(function(r){return !r.approved}).findIndex(function(r){return r.id===report.id});
  if(index<0)return msg("Report is not awaiting review.");

  '<label class="label">Doctor-reviewed explanation</label>'+textField("Enter a fictional clinician-reviewed interpretation. Do not use real patient data.","modal-value"));return;
 }
 if(a==="task-demo-critical"){

  reports.push(rep);createReportTask(rep,true);addAlert("doctor","Demo critical lab flag — action needed","No real critical result exists. A lab-verified critical-value notification would require immediate direct communication.","warning","inbox");
  taskFilter="critical";render();msg("Fictional critical-value workflow created. This is not a real medical alarm.");return;
 }

 if(a.indexOf("nav:")===0){navigate(a.slice(4));return}
 if(a.indexOf("role:")===0){role=a.slice(5);$("role").value=role;navigate("home");return}
 if(a.indexOf("day:")===0){var old=done;done=Math.min(7,Number(a.split(":")[1])+1);if(done>old)addAlert("doctor","Home nursing progress updated","Ananya Sharma · "+done+" of 7 visits marked in the demo.","info","inbox");render();msg("Simulated visit progress changed. No real care recorded.");return}
 if(a==="nurse-next"){var old=done;done=Math.min(7,done+1);if(done>old)addAlert("doctor","Home nursing visit marked complete","Ananya Sharma · "+done+" of 7 fictional visits recorded.","info","inbox");render();msg("Demo visit progress updated, not actual administration.");return}
 if(a.indexOf("book:")===0){drawer("booking:"+a.slice(5),"Request "+a.slice(5),"Fictional providers only. This is a local UI demonstration; no appointment is made.",'<label class="label">Preferred date or time (optional)</label><input id="modal-value" class="field" type="text" placeholder="e.g. Friday morning">');return}
 if(a==="guide:"){return}
 if(a.indexOf("guide:")===0){drawer("guide","Care navigation","A clinician may consider this specialty, but symptom severity and health context can change the appropriate choice. Severe symptoms require urgent assessment.",'<div class="caution">Selected concern: '+esc(a.slice(6))+'. Not a diagnosis or validated triage result.</div>');return}
 if(a==="note-save"){var val=$("notearea").value.trim();if(!val)return msg("Enter clinical notes first.");pendingNote=val;approvedNote=false;render();msg("Unsigned note saved. Only doctor view can show it.");return}
 if(a==="note-approve"){var value=$("notearea")?.value?.trim()||pendingNote;if(!value)return msg("Add notes and review before approving.");pendingNote=value;approvedNote=true;addAlert("patient","Consultation note available","Dr. Meera Rao approved a fictional consultation note.","info","records");render();msg("Fictional note approved; check the patient records.");return}
 if(a==="med-add"){if(selection==="Amoxicillin")return msg("Potential allergy conflict. Entry blocked in demo.");if(rx.indexOf(selection)<0)rx.push(selection);render();msg("Medicine added to unsigned draft. No prescription issued.");return}
 if(a.indexOf("confirm:")===0){var idx=Number(a.slice(8));var diagnostics=bookings.filter(function(b){return b.type!=="Home nursing"});if(diagnostics[idx]){diagnostics[idx].status="Confirmed";addAlert("doctor","Diagnostic booking confirmed","Ananya Sharma · "+diagnostics[idx].type+" · Sample appointment confirmed.","info","inbox");addAlert("patient","Diagnostic appointment confirmed",diagnostics[idx].type+" · This is a demo confirmation only.","info","services");}render();msg("Sample booking confirmed in demo only.");return}
 if(a.indexOf("lab-report:")===0){drawer("report:"+a.slice(11),"Submit sample lab result","Fictional text only. Doctor review is mandatory before patient release.",textField("Enter a fictional diagnostic summary. Never use real patient data.","modal-value"));return}
 if(a.indexOf("review:")===0){drawer(a,"Doctor review of report","This is an illustrative approval, not a clinically valid report release.",textField("Doctor-approved fictional explanation","modal-value"));return}
